agent:
  name: venus
  # opencode: model is provider/model, provider defined below.
  # claude_api: model is an Anthropic model id, e.g. claude-sonnet-5.
  backend: opencode
  model: scaleway/qwen3-coder-30b-a3b-instruct
  max_tokens: 16000
  effort: medium
  cache_prompts: true
  system_prompt: >-
    You are a helpful home automation assistant called {name}.
    You help manage infrastructure, write code, and automate tasks.
    Be concise and practical.

opencode:
  binary: opencode
  # Any OpenAI-compatible endpoint. Scaleway Generative APIs (EU, already a supplier
  # for the Venus backup); the key comes from the environment, never from here.
  provider:
    scaleway:
      npm: "@ai-sdk/openai-compatible"
      name: "Scaleway Generative APIs"
      options:
        baseURL: "https://api.scaleway.ai/v1"
        apiKey: "{env:SCALEWAY_API_KEY}"
      models:
        qwen3-coder-30b-a3b-instruct:
          name: "Qwen3 Coder 30B A3B"

api:
  host: "0.0.0.0"
  port: 8080

tools:
  enabled:
    - shell
    - file_read
    - file_write
    - git
  shell_timeout: 30
  allowed_paths:
    - /opt/smartworkx
    - /tmp
  git_repos:
    - /opt/smartworkx

conversation:
  max_history: 50

store:
  url: "nats://localhost:4222"
  stream: "MINION_EVENTS"

tasks:
  claim_stale_minutes: 30
  max_attempts: 3
  run_timeout_minutes: 20
  max_concurrent_runs: 1
  daily_token_budget: 0

webhooks:
  # Grafana's webhook contact point sends a Bearer token, not an HMAC. LAN/WireGuard
  # only. The secret comes from the environment: MINION_WEBHOOKS__SECRETS__GRAFANA.
  allow_bearer:
    - grafana

signal:
  # signal-api on Mars. Numbers from the environment: MINION_SIGNAL__NUMBER,
  # MINION_SIGNAL__RECIPIENTS='["+31…"]'. Without them the handler stays off.
  url: "http://mars:8081"
  handles:
    - depot_error_detected

agents:
  # A fact type → the repo's own agent in `.agents/agents/<agent>/`. The ceiling is
  # all the repo cannot decide itself; the agent can only narrow it.
  # Needs GH_TOKEN (contents + pull requests on the repo) for clone, push and PR.
  # None here: an agent is trained locally (local.yml) and added here only once it
  # has proven itself — until then Venus only receives, records and notifies.
  handles: {}

github:
  repo: ""
  poll_interval: 60
  labels:
    plan: "minion:plan"
    planning: "minion:planning"
    planned: "minion:planned"
    implement: "minion:implement"
    implementing: "minion:implementing"
    done: "minion:done"
