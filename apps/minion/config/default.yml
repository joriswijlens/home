agent:
  name: venus
  backend: claude_api
  model: claude-sonnet-5
  max_tokens: 16000
  effort: medium
  system_prompt: >-
    You are a helpful home automation assistant called {name}.
    You help manage infrastructure, write code, and automate tasks.
    Be concise and practical.

api:
  host: "0.0.0.0"
  port: 8080

tools:
  enabled:
    - shell
    - file_read
    - file_write
    - git
  shell_timeout: 30
  allowed_paths:
    - /opt/smartworkx
    - /tmp
  git_repos:
    - /opt/smartworkx

conversation:
  max_history: 50

store:
  db_path: "/data/minion.db"

tasks:
  claim_stale_minutes: 30
  max_attempts: 3
  run_timeout_minutes: 20
  max_concurrent_runs: 1
  daily_token_budget: 0

github:
  repo: ""
  poll_interval: 60
  labels:
    plan: "minion:plan"
    planning: "minion:planning"
    planned: "minion:planned"
    implement: "minion:implement"
    implementing: "minion:implementing"
    done: "minion:done"
