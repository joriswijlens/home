# EMHASS (http://localhost:5000) — day-ahead optimization for Deye battery, Weheat and Peblar.
# Zonneplan forecast prices are integers in 1e-7 EUR/kWh, hourly; EMHASS runs with a 60 min step.
rest_command:
  emhass_dayahead_optim:
    url: http://localhost:5000/action/dayahead-optim
    method: POST
    content_type: application/json
    timeout: 120
    payload: >-
      {% set h = now().replace(minute=0, second=0, microsecond=0) %}
      {% set ns = namespace(p=[]) %}
      {% for e in state_attr('sensor.zonneplan_current_electricity_tariff', 'forecast') or [] %}
      {% if as_datetime(e.datetime) >= h and ns.p | length < 24 %}
      {% set ns.p = ns.p + [(e.electricity_price | float(0) / 10000000) | round(4)] %}
      {% endif %}
      {% endfor %}
      {"load_cost_forecast": {{ ns.p | tojson }},
       "prod_price_forecast": {{ ns.p | tojson }},
       "soc_init": {{ (states('sensor.deye_local_battery_soc') | float(50) / 100) | round(2) }},
       "soc_final": 0.2}
  emhass_publish_data:
    url: http://localhost:5000/action/publish-data
    method: POST
    content_type: application/json
    payload: "{}"

template:
  - sensor:
      # The Envoy reports kW; EMHASS and the load calculation want W.
      - name: "Solar power W"
        unique_id: solar_power_w
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: "{{ states('sensor.envoy_122221060206_current_power_production') | is_number }}"
        state: "{{ (states('sensor.envoy_122221060206_current_power_production') | float(0) * 1000) | round(0) }}"

      # House load excluding the controllable loads (heat pump, EV charger).
      # grid import - export + solar + battery discharge (positive = discharging) = total house load.
      - name: "House load no var loads"
        unique_id: house_load_no_var_loads
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        # Only valid when all inputs are numeric, and only within a sane range; otherwise
        # unavailable, so EMHASS never learns from garbage.
        availability: >-
          {% set v = (states('sensor.connect_energiemeter_elektriciteitsverbruik') | float(none),
                      states('sensor.connect_energiemeter_elektriciteitsproductie') | float(none),
                      states('sensor.solar_power_w') | float(none),
                      states('sensor.deye_local_battery_power') | float(none),
                      states('sensor.blackbird_p80_heat_pump_vermogen_in') | float(none),
                      states('sensor.peblar_ev_charger_vermogen') | float(none)) %}
          {% set total = v[0] - v[1] + v[2] + v[3] - v[4] - v[5] if none not in v else none %}
          {{ total is not none and 0 <= total <= 30000 }}
        state: >-
          {{ (states('sensor.connect_energiemeter_elektriciteitsverbruik') | float(0)
              - states('sensor.connect_energiemeter_elektriciteitsproductie') | float(0)
              + states('sensor.solar_power_w') | float(0)
              + states('sensor.deye_local_battery_power') | float(0)
              - states('sensor.blackbird_p80_heat_pump_vermogen_in') | float(0)
              - states('sensor.peblar_ev_charger_vermogen') | float(0)) | round(0) }}
