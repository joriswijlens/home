# EMHASS (http://localhost:5000) — day-ahead optimization for Deye battery, Weheat and Peblar.
# Zonneplan forecast prices are integers in 1e-7 EUR/kWh, hourly; EMHASS runs with a 60 min step.
rest_command:
  emhass_dayahead_optim:
    url: http://localhost:5000/action/dayahead-optim
    method: POST
    content_type: application/json
    timeout: 120
    payload: >-
      {% set h = now().replace(minute=0, second=0, microsecond=0) %}
      {% set ns = namespace(p=[]) %}
      {% for e in state_attr('sensor.zonneplan_current_electricity_tariff', 'forecast') or [] %}
      {% if as_datetime(e.datetime) >= h and ns.p | length < 24 %}
      {% set ns.p = ns.p + [(e.electricity_price | float(0) / 10000000) | round(4)] %}
      {% endif %}
      {% endfor %}
      {"load_cost_forecast": {{ ns.p | tojson }},
       "prod_price_forecast": {{ ns.p | tojson }},
       "soc_init": {{ (states('sensor.deye_local_battery_soc') | float(50) / 100) | round(2) }},
       "soc_final": 0.2}
  emhass_publish_data:
    url: http://localhost:5000/action/publish-data
    method: POST
    content_type: application/json
    payload: "{}"

template:
  - sensor:
      # Most expensive price in the next 24 h divided by the current hour's price.
      - name: "Electricity price spread ratio"
        unique_id: electricity_price_spread_ratio
        state: >-
          {% set h = now().replace(minute=0, second=0, microsecond=0) %}
          {% set ns = namespace(p=[]) %}
          {% for e in state_attr('sensor.zonneplan_current_electricity_tariff', 'forecast') or [] %}
          {% if as_datetime(e.datetime) >= h and ns.p | length < 24 %}
          {% set ns.p = ns.p + [e.electricity_price | float(0)] %}
          {% endif %}
          {% endfor %}
          {{ (ns.p | max / ns.p[0]) | round(2) if ns.p and ns.p[0] > 0 else none }}
        availability: "{{ state_attr('sensor.zonneplan_current_electricity_tariff', 'forecast') is not none }}"

      # The Envoy reports kW; EMHASS and the load calculation want W.
      - name: "Solar power W"
        unique_id: solar_power_w
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: "{{ states('sensor.envoy_122221060206_current_power_production') | is_number }}"
        state: "{{ (states('sensor.envoy_122221060206_current_power_production') | float(0) * 1000) | round(0) }}"

      # House load excluding the controllable loads (heat pump, EV charger):
      # the inverter's own load reading minus those two. Grid/battery/solar sums mixed
      # sources sampled at different moments and were unreliable.
      - name: "House load no var loads"
        unique_id: house_load_no_var_loads
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: >-
          {% set v = (states('sensor.deye_local_load_power') | float(none),
                      states('sensor.blackbird_p80_heat_pump_vermogen_in') | float(none),
                      states('sensor.peblar_ev_charger_vermogen') | float(none)) %}
          {{ none not in v and 0 <= v[0] - v[1] - v[2] <= 30000 }}
        state: >-
          {{ (states('sensor.deye_local_load_power') | float(0)
              - states('sensor.blackbird_p80_heat_pump_vermogen_in') | float(0)
              - states('sensor.peblar_ev_charger_vermogen') | float(0)) | round(0) }}

input_boolean:
  # Master switch for EMHASS battery control via the Deye TOU registers.
  emhass_battery_control:
    name: "EMHASS batterij aansturing"
    icon: mdi:battery-sync
  # Master switch for EMHASS hot water control via the Weheat DHW target.
  emhass_dhw_control:
    name: "EMHASS warm water aansturing"
    icon: mdi:water-boiler

input_number:
  dhw_base_temperature:
    name: "Warm water basis doel (overdag en nacht)"
    initial: 45  # set in git; UI changes reset on restart
    min: 40
    max: 55
    step: 1
    unit_of_measurement: "°C"
    icon: mdi:water-thermometer
  dhw_evening_temperature:
    name: "Warm water doel avond (bad)"
    initial: 50
    min: 45
    max: 60
    step: 1
    unit_of_measurement: "°C"
    icon: mdi:bathtub
  dhw_block_temperature:
    name: "Warm water blok doel (goedkoop)"
    initial: 55
    min: 45
    max: 60
    step: 1
    unit_of_measurement: "°C"
    icon: mdi:water-thermometer-outline
  dhw_block_high_temperature:
    name: "Warm water blok doel (hoge spread)"
    initial: 60
    min: 50
    max: 60
    step: 1
    unit_of_measurement: "°C"
    icon: mdi:water-thermometer-outline
  dhw_high_spread_ratio:
    name: "Spread voor hoog blok doel"
    initial: 1.35
    min: 1.0
    max: 3.0
    step: 0.05
    icon: mdi:chart-line-variant

input_datetime:
  dhw_evening_start:
    name: "Warm water avond vanaf"
    has_date: false
    has_time: true
    initial: "20:00:00"
  dhw_evening_end:
    name: "Warm water avond tot"
    has_date: false
    has_time: true
    initial: "22:30:00"
