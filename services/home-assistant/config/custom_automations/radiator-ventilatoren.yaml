- alias: Radiator ventilatoren aan
  description: "Aan zodra CV-aanvoer minstens 5 °C warmer is dan de kamer (niet tijdens warm tapwater)"
  triggers:
    - trigger: template
      value_template: >
        {{ states('sensor.blackbird_p80_heat_pump_watertemperatuur_uit') | float(0)
           - states('sensor.blackbird_p80_heat_pump_huidige_kamertemperatuur') | float(99) >= 5
           and states('sensor.blackbird_p80_heat_pump_central_heating_pump_flow') | float(0) > 0
           and states('sensor.blackbird_p80_heat_pump_dhw_pump_flow') | float(0) == 0 }}
      for:
        minutes: 1
  actions:
    - action: switch.turn_on
      target:
        entity_id:
          - switch.radiator_ventilator_links
          - switch.radiator_ventilator_rechts
  mode: single

- alias: Radiator ventilatoren uit
  description: "Uit zodra CV-aanvoer minder dan 3 °C warmer is dan de kamer of de CV-pomp stopt"
  triggers:
    - trigger: template
      value_template: >
        {{ states('sensor.blackbird_p80_heat_pump_watertemperatuur_uit') | float(0)
           - states('sensor.blackbird_p80_heat_pump_huidige_kamertemperatuur') | float(0) < 3
           or states('sensor.blackbird_p80_heat_pump_central_heating_pump_flow') | float(0) == 0 }}
      for:
        minutes: 5
  actions:
    - action: switch.turn_off
      target:
        entity_id:
          - switch.radiator_ventilator_links
          - switch.radiator_ventilator_rechts
  mode: single
