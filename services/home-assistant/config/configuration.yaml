default_config:

homeassistant:
  packages: !include_dir_named packages

automation manual: !include_dir_merge_list custom_automations
automation ui: !include automations.yaml
script: !include_dir_merge_named scripts
scene: !include_dir_merge_list scenes
template: !include_dir_merge_list templates

lovelace:
  mode: storage
  dashboards:
    energie-monitor:
      mode: yaml
      title: "Energiemonitor"
      icon: mdi:flash
      filename: dashboards/energie.yaml
    weheat-dashboard:
      mode: yaml
      title: "Weheat"
      icon: mdi:heat-pump-outline
      filename: dashboards/weheat.yaml
    laadpaal-dashboard:
      mode: yaml
      title: "Laadpaal"
      icon: mdi:ev-station
      filename: dashboards/laadpaal.yaml
