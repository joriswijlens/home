title: "Energiemonitor"
views:
  - title: Overzicht
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: energy-date-selection
          - type: energy-usage-graph
          - type: energy-solar-graph

      - type: grid
        cards:
          - type: heading
            heading: "Netto Energiekosten"
            heading_style: subtitle
          - type: custom:apexcharts-card
            header:
              title: "Kosten per uur (verbruik − teruglevering)"
              show: true
            graph_span: 24h
            span:
              start: day
            apex_config:
              chart:
                toolbar:
                  show: true
                stacked: true
              xaxis:
                labels:
                  format: "HH:mm"
              yaxis:
                - title:
                    text: "€/h"
                  decimalsInFloat: 2
              tooltip:
                x:
                  format: "HH:mm"
            now:
              show: true
              color: "#FF4560"
            series:
              - entity: sensor.energiekosten_per_uur
                name: "Netto kosten"
                type: area
                color: "#FF9800"
                opacity: 0.3
                stroke_width: 2
                float_precision: 2

      - type: grid
        cards:
          - type: heading
            heading: "Day-Ahead Tarieven"
            heading_style: subtitle
          - type: custom:apexcharts-card
            header:
              title: "Zonneplan Tarieven"
              show: true
            graph_span: 48h
            span:
              start: day
            apex_config:
              chart:
                toolbar:
                  show: true
              xaxis:
                labels:
                  format: "HH:mm"
              yaxis:
                - title:
                    text: "€/kWh"
                  decimalsInFloat: 2
              tooltip:
                x:
                  format: "dd MMM HH:mm"
                "y":
                  formatter: |
                    EVAL:function(value) { return '€ ' + value.toFixed(2); }
            now:
              show: true
              color: "#FF4560"
            series:
              - entity: sensor.zonneplan_current_electricity_tariff
                name: "Tarief"
                type: area
                color: "#4CAF50"
                opacity: 0.3
                stroke_width: 2
                float_precision: 2
                data_generator: |
                  const forecast = entity.attributes.forecast || [];
                  return forecast.map(f => {
                    return [new Date(f.datetime).getTime(), Math.round(f.electricity_price / 100000) / 100];
                  });

      - type: grid
        cards:
          - type: heading
            heading: "EMHASS"
            heading_style: subtitle
          - type: custom:apexcharts-card
            header:
              title: "Batterij: gedaan (12 u) en plan (24 u)"
              show: true
            graph_span: 36h
            span:
              start: hour
              offset: -12h
            now:
              show: true
              color: "#FF4560"
            apex_config:
              xaxis:
                labels:
                  format: "HH:mm"
              tooltip:
                x:
                  format: "dd MMM HH:mm"
            yaxis:
              - id: soc
                min: 0
                max: 100
                decimals: 0
                apex_config:
                  title:
                    text: "SOC %"
              - id: power
                opposite: true
                decimals: 0
                apex_config:
                  title:
                    text: "W (+ ontladen, − laden)"
            series:
              - entity: sensor.deye_local_battery_soc
                name: "SOC"
                yaxis_id: soc
                color: "#2196F3"
                stroke_width: 2
              - entity: sensor.soc_batt_forecast
                name: "SOC plan"
                yaxis_id: soc
                color: "#2196F3"
                stroke_dash: 4
                stroke_width: 2
                data_generator: |
                  return (entity.attributes.battery_scheduled_soc || []).map(f =>
                    [new Date(f.date).getTime(), parseFloat(f.soc_batt_forecast)]);
              - entity: sensor.deye_tou_target_soc
                name: "TOU doel-SOC"
                yaxis_id: soc
                color: "#9C27B0"
                curve: stepline
                stroke_width: 1
              - entity: sensor.deye_local_battery_power
                name: "Vermogen"
                yaxis_id: power
                type: area
                color: "#FF9800"
                opacity: 0.2
                stroke_width: 1
                group_by:
                  func: avg
                  duration: 5min
              - entity: sensor.p_batt_forecast
                name: "Vermogen plan"
                yaxis_id: power
                curve: stepline
                color: "#FF9800"
                stroke_dash: 4
                stroke_width: 2
                data_generator: |
                  return (entity.attributes.battery_scheduled_power || []).map(f =>
                    [new Date(f.date).getTime(), parseFloat(f.p_batt_forecast)]);
          - type: custom:apexcharts-card
            header:
              title: "Warm water: gedaan (12 u) en plan (24 u)"
              show: true
            graph_span: 36h
            span:
              start: hour
              offset: -12h
            now:
              show: true
              color: "#FF4560"
            apex_config:
              xaxis:
                labels:
                  format: "HH:mm"
              tooltip:
                x:
                  format: "dd MMM HH:mm"
            yaxis:
              - id: temp
                min: 30
                max: 65
                decimals: 0
                apex_config:
                  title:
                    text: "°C"
              - id: power
                opposite: true
                min: 0
                decimals: 0
                apex_config:
                  title:
                    text: "W"
            series:
              - entity: sensor.blackbird_p80_heat_pump_sww_temperatuur_boventemperatuur
                name: "Boiler boven"
                yaxis_id: temp
                color: "#F44336"
                stroke_width: 2
              - entity: number.weheat_heat_pump_hot_water_target_temperature
                name: "Doeltemperatuur"
                yaxis_id: temp
                curve: stepline
                color: "#9C27B0"
                stroke_width: 1
              - entity: sensor.blackbird_p80_heat_pump_vermogen_in
                name: "WP vermogen"
                yaxis_id: power
                type: area
                color: "#FF9800"
                opacity: 0.2
                stroke_width: 1
                group_by:
                  func: avg
                  duration: 5min
              - entity: sensor.p_deferrable0
                name: "Blok plan"
                yaxis_id: power
                curve: stepline
                color: "#FF9800"
                stroke_dash: 4
                stroke_width: 2
                data_generator: |
                  return (entity.attributes.deferrables_schedule || []).map(f =>
                    [new Date(f.date).getTime(), parseFloat(f.p_deferrable0)]);
          - type: entities
            title: "EMHASS sturing"
            entities:
              - input_boolean.emhass_battery_control
              - input_boolean.emhass_dhw_control
              - sensor.electricity_price_spread_ratio
              - input_number.dhw_base_temperature
              - input_number.dhw_evening_temperature
              - input_number.dhw_block_temperature
              - input_number.dhw_block_high_temperature
              - input_number.dhw_high_spread_ratio
              - input_datetime.dhw_evening_start
              - input_datetime.dhw_evening_end
