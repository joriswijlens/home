---
- name: Backup smartworkx volumes
  hosts: all
  become: true
  vars:
    volumes_dir: /opt/smartworkx/volumes
    backup_dir: /opt/smartworkx/backups
    backups_to_keep: 7

  tasks:
    - name: Ensure backup directory exists
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        mode: '0755'

    - name: Create backup
      community.general.archive:
        path: "{{ volumes_dir }}"
        dest: "{{ backup_dir }}/backup-{{ ansible_date_time.iso8601_basic_short }}.tgz"
        format: gz
        # HA's own backups go offsite via Scaleway; the .db.* files are stale copies.
        exclusion_patterns:
          - "*/home-assistant/config/backups/*"
          - "*/home-assistant/config/home-assistant_v2.db.*"

    - name: Find existing backups
      ansible.builtin.find:
        paths: "{{ backup_dir }}"
        patterns: "backup-*.tgz"
      register: existing_backups

    - name: Remove backups beyond the newest {{ backups_to_keep }}
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ (existing_backups.files | sort(attribute='mtime', reverse=true))[backups_to_keep:] }}"
      loop_control:
        label: "{{ item.path | basename }}"