---
- name: Restore smartworkx volumes
  hosts: all
  become: true
  vars:
    base_dir: /opt/smartworkx
    backup_dir: /opt/smartworkx/backups
    compose_project: services
    # backup_file: /opt/smartworkx/backups/backup-YYYYMMDDTHHMMSS.tgz # Pass this as an extra var

  tasks:
    - name: Find latest backup if backup_file is not provided
      block:
        - name: Find latest backup
          ansible.builtin.find:
            paths: "{{ backup_dir }}"
            patterns: "backup-*.tgz"
          register: backup_files

        - name: Set latest backup file
          ansible.builtin.set_fact:
            backup_file: "{{ (backup_files.files | sort(attribute='mtime', reverse=true) | first).path }}"
      when: backup_file is not defined

    - name: Stop services
      ansible.builtin.command: docker compose -p {{ compose_project }} stop

    # Move aside instead of deleting, so a bad restore can be undone.
    - name: Move current volumes aside
      ansible.builtin.command: >-
        mv {{ base_dir }}/volumes
        {{ base_dir }}/volumes.pre-restore-{{ ansible_date_time.iso8601_basic_short }}

    # Archives contain paths starting with volumes/
    - name: Restore volumes from backup
      ansible.builtin.unarchive:
        src: "{{ backup_file }}"
        dest: "{{ base_dir }}"
        remote_src: true

    - name: Start services
      ansible.builtin.command: docker compose -p {{ compose_project }} start
