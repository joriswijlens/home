---
- hosts: all
  become: true
  vars:
    volumes_dir: /opt/smartworkx/volumes

  tasks:
    - name: Find service directories
      delegate_to: localhost
      run_once: true
      become: false
      find:
        paths: "{{ playbook_dir }}/../../../services"
        file_type: directory
        recurse: no
      register: service_dirs_find

    - name: Extract service names
      delegate_to: localhost
      run_once: true
      become: false
      set_fact:
        service_names: "{{ service_dirs_find.files | map(attribute='path') | map('basename') | list }}"

    - name: Ensure service config directories exist
      vars:
        service_file: "{{ playbook_dir }}/../../../services/{{ item }}/service.yml"
        service_config: "{{ lookup('file', service_file) | from_yaml }}"
        config_dir: "{{ service_config.service.config_dir }}"
      ansible.builtin.file:
        path: "{{ volumes_dir }}/{{ item }}/{{ config_dir }}"
        state: directory
      loop: "{{ service_names }}"

    - name: Copy service configurations
      vars:
        service_file: "{{ playbook_dir }}/../../../services/{{ item }}/service.yml"
        service_config: "{{ lookup('file', service_file) | from_yaml }}"
        config_dir: "{{ service_config.service.config_dir }}"
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/../../../services/{{ item }}/{{ config_dir }}/"
        dest: "{{ volumes_dir }}/{{ item }}/{{ config_dir }}"
        mode: push
        delete: false
        recursive: true
        rsync_opts:
          - "--exclude=.gitignore"
      loop: "{{ service_names }}"

    - name: Read pinned custom integrations
      delegate_to: localhost
      run_once: true
      become: false
      set_fact:
        custom_components: "{{ (lookup('file', playbook_dir + '/../../../services/home-assistant/custom_components.yml') | from_yaml).custom_components }}"

    - name: Check out custom integrations at their pinned version
      delegate_to: localhost
      run_once: true
      become: false
      ansible.builtin.git:
        repo: "{{ item.repo }}"
        version: "{{ item.version }}"
        dest: "{{ lookup('env', 'HOME') }}/.cache/smartworkx/custom_components/{{ item.name }}"
        force: true
      loop: "{{ custom_components }}"

    - name: Install custom integrations into Home Assistant
      ansible.posix.synchronize:
        src: "{{ lookup('env', 'HOME') }}/.cache/smartworkx/custom_components/{{ item.name }}/custom_components/{{ item.name }}/"
        dest: "{{ volumes_dir }}/home-assistant/config/custom_components/{{ item.name }}"
        mode: push
        delete: true
        recursive: true
        rsync_opts:
          - "--exclude=__pycache__"
      loop: "{{ custom_components }}"

    - name: Restart Docker Compose services
      delegate_to: localhost
      become: false
      ansible.builtin.shell:
        cmd: "docker --context mars compose -f docker-compose.yml restart"
        chdir: "{{ playbook_dir }}/../../../services"
